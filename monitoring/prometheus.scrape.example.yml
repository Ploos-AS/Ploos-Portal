# Merge this job into the existing scrape_configs list on Mimir.
# Replace exporter address with the verified local Blackbox endpoint.
- job_name: ploos-portal
  metrics_path: /probe
  scrape_interval: 30s
  scrape_timeout: 10s
  params:
    module: [http_2xx]
  static_configs:
    - targets: ['https://beta.account.ploos.no/']
      labels:
        check: homepage
    - targets: ['https://beta.account.ploos.no/healthz']
      labels:
        check: health
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - source_labels: [__param_target]
      target_label: instance
    - target_label: __address__
      replacement: '127.0.0.1:9115'
